
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamil Nadu Police Login</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #061a36, #164b89);
        }

        .login-box {
            width: 390px;
            background: white;
            padding: 35px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        /* TN Police logo - 1.jpeg */
        .logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        h1 {
            margin: 5px 0 8px;
            color: #0b2d5c;
            font-size: 27px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: #777;
            margin-bottom: 25px;
        }

        .input-box {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 7px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #bbb;
            border-radius: 7px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #0b2d5c;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            background: #0b2d5c;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #164b89;
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <!-- Your GitHub 1.jpeg image -->
        <img src="1.jpeg" alt="TN Police Logo" class="logo">

        <h1>TAMILNADU POLICE</h1>

        <div class="subtitle">
            Police Department
        </div>

        <form onsubmit="loginDemo(event)">

            <div class="input-box">
                <label for="username">User Name:</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter User Name"
                    required>
            </div>

            <div class="input-box">
                <label for="password">Password:</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter Password"
                    required>
            </div>

            <button type="submit" class="login-btn">
                LOGIN
            </button>

        </form>

        <div id="message"></div>

        <div class="footer">
            Demo Login Page
        </div>

    </div>

    <script>
        function loginDemo(event) {
            event.preventDefault();

            document.getElementById("message").textContent =
                "Login submitted successfully.";
        }
    </script>

</body>
</html>
